services:
  app:
    container_name: bm-app
    # Single build for app/queue/reverb; other services reuse this tag (pull_policy: never).
    image: bm-app:latest
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: production
      args:
        PHP_BUILD_IMAGE: ${PHP_BUILD_IMAGE:-mirror.gcr.io/library/php:8.4-cli}
        PHP_RUNTIME_IMAGE: ${PHP_RUNTIME_IMAGE:-mirror.gcr.io/library/php:8.4-apache}
    restart: unless-stopped
    # Host → container :80 (default host port 8013; set APP_PORT in `.env` used for compose interpolation).
    ports:
      - target: 80
        published: "${APP_PORT:-8013}"
        protocol: tcp
    volumes:
      # Named volume for public/build would shadow fresh Vite output from each image build.
      - bm-app-storage:/var/www/storage
    env_file:
      - .env
    environment:
      # Laravel→Reverb on Docker must use REVERB_SERVER_PORT (listen port), not necessarily REVERB_PORT from .env,
      # which is often host/browser-facing (see .env.example).
      REVERB_HOST: ${DOCKER_REVERB_HOST:-reverb}
      REVERB_PORT: ${REVERB_SERVER_PORT:-8015}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      REDIS_HOST: redis
    networks:
      - bm-network
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -fsS http://127.0.0.1/ >/dev/null || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      reverb:
        condition: service_healthy

  # Processes ShouldQueue jobs (e.g. CSV import). Without this, imports stay "pending" forever.
  queue:
    container_name: bm-queue
    image: bm-app:latest
    pull_policy: never
    restart: unless-stopped
    volumes:
      - bm-app-storage:/var/www/storage
    env_file:
      - .env
    environment:
      REVERB_HOST: ${DOCKER_REVERB_HOST:-reverb}
      REVERB_PORT: ${REVERB_SERVER_PORT:-8015}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      REDIS_HOST: redis
    networks:
      - bm-network
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      reverb:
        condition: service_healthy
    command:
      - runuser
      - -u
      - www-data
      - --
      - env
      - HOME=/var/www
      - sh
      - -c
      - cd /var/www && exec php artisan queue:work --queue=broadcasts,default --sleep=3 --tries=3 --timeout=300 --max-time=3600

  redis:
    container_name: bm-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bm-redis-data:/data
    networks:
      - bm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  reverb:
    container_name: bm-reverb
    image: bm-app:latest
    pull_policy: never
    restart: unless-stopped
    volumes:
      - bm-app-storage:/var/www/storage
    env_file:
      - .env
    environment:
      LARAVEL_CONTAINER_ROLE: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: ${REVERB_SERVER_PORT:-8015}
    networks:
      - bm-network
    ports:
      - "${REVERB_PORT:-8015}:${REVERB_SERVER_PORT:-8015}"
    # TCP open on WebSocket port (must match REVERB_SERVER_PORT / reverb:start --port).
    # Bash /dev/tcp avoids Compose $$ escaping bugs with php -r healthchecks.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/${REVERB_SERVER_PORT:-8015}' || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 25s
    command:
      - runuser
      - -u
      - www-data
      - --
      - env
      - HOME=/var/www
      - sh
      - -c
      - cd /var/www && exec php artisan reverb:start --host=0.0.0.0 --port=${REVERB_SERVER_PORT:-8015}

networks:
  bm-network:


volumes:
  bm-app-storage:
  bm-redis-data:
