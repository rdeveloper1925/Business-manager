services:
  app:
    container_name: bm-app
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: production
      args:
        PHP_BUILD_IMAGE: ${PHP_BUILD_IMAGE:-mirror.gcr.io/library/php:8.4-cli}
        PHP_RUNTIME_IMAGE: ${PHP_RUNTIME_IMAGE:-mirror.gcr.io/library/php:8.4-apache}
    restart: unless-stopped
    # Host → container :80 (default host port 8013; set APP_PORT in `.env` used for compose interpolation).
    ports:
      - target: 80
        published: "${APP_PORT:-8013}"
        protocol: tcp
    volumes:
      # Named volume for public/build would shadow fresh Vite output from each image build.
      - bm-app-storage:/var/www/storage
    env_file:
      - .env
    environment:
      # Must match Reverb's listen port inside the network (reverb:start --port / REVERB_SERVER_PORT).
      # Do not use .env REVERB_PORT here — it is often 8080 for local `reverb:start`, which breaks Docker.
      REVERB_HOST: ${DOCKER_REVERB_HOST:-reverb}
      REVERB_PORT: '8015'
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
    networks:
      - bm-network
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -fsS http://127.0.0.1/ >/dev/null || exit 1' ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      reverb:
        condition: service_healthy

  # Processes ShouldQueue jobs (e.g. CSV import). Without this, imports stay "pending" forever.
  queue:
    container_name: bm-queue
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: production
      args:
        PHP_BUILD_IMAGE: ${PHP_BUILD_IMAGE:-mirror.gcr.io/library/php:8.4-cli}
        PHP_RUNTIME_IMAGE: ${PHP_RUNTIME_IMAGE:-mirror.gcr.io/library/php:8.4-apache}
    restart: unless-stopped
    volumes:
      - bm-app-storage:/var/www/storage
    env_file:
      - .env
    environment:
      REVERB_HOST: ${DOCKER_REVERB_HOST:-reverb}
      REVERB_PORT: '8015'
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
    networks:
      - bm-network
    depends_on:
      reverb:
        condition: service_healthy
    command:
      - runuser
      - -u
      - www-data
      - --
      - env
      - HOME=/var/www
      - sh
      - -c
      - cd /var/www && exec php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  reverb:
    container_name: bm-reverb
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: production
      args:
        PHP_BUILD_IMAGE: ${PHP_BUILD_IMAGE:-mirror.gcr.io/library/php:8.4-cli}
        PHP_RUNTIME_IMAGE: ${PHP_RUNTIME_IMAGE:-mirror.gcr.io/library/php:8.4-apache}
    restart: unless-stopped
    volumes:
      - bm-app-storage:/var/www/storage
    env_file:
      - .env
    environment:
      LARAVEL_CONTAINER_ROLE: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8015
    networks:
      - bm-network
    ports:
      - "${REVERB_PORT:-8015}:8015"
    # TCP open on WebSocket port (must match REVERB_SERVER_PORT / reverb:start --port).
    # Bash /dev/tcp avoids Compose $$ escaping bugs with php -r healthchecks.
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8015' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 25s
    command:
      - runuser
      - -u
      - www-data
      - --
      - env
      - HOME=/var/www
      - sh
      - -c
      - cd /var/www && exec php artisan reverb:start --host=0.0.0.0 --port=8015

networks:
  bm-network:


volumes:
  bm-app-storage:
